{% extends "base.html" %}{% block title %}Change password{% endblock %}{% block heading %}Account security{% endblock %}
{% block content %}<div class="panel narrow"><h3>Change password</h3><p class="muted">Use a unique password of at least 12 characters.</p><form method="post" class="form-stack"><label>Current password<input type="password" name="old_password" required autocomplete="current-password"></label><label>New password<input type="password" name="new_password" minlength="12" required autocomplete="new-password"></label><button class="btn btn-primary">Update password</button></form></div>{% endblock %}
